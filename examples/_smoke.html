<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smoke Test — my-engine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #eee; font-family: monospace; padding: 2rem; }
    h1 { margin-bottom: 1rem; }
    .test { padding: 4px 8px; margin: 2px 0; border-radius: 3px; }
    .pass { background: #1a4d1a; color: #4f4; }
    .fail { background: #4d1a1a; color: #f44; }
    .running { background: #4d4d1a; color: #ff4; }
    #summary { margin-top: 1rem; padding: 10px; font-weight: bold; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "my-engine": "../engine/index.js",
      "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.mjs",
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/+esm",
      "json5": "https://cdn.jsdelivr.net/npm/json5@2.2.3/+esm"
    }
  }
  </script>
</head>
<body>
  <h1>🔬 Smoke Test</h1>
  <div id="results"></div>
  <div id="summary"></div>
  <div id="game" style="width:1px;height:1px;overflow:hidden;position:absolute;left:-9999px;"></div>

  <script type="module">
    const results = document.getElementById('results');
    const summary = document.getElementById('summary');
    let passed = 0, failed = 0;

    async function runTest(name, fn) {
      const div = document.createElement('div');
      div.className = 'test running';
      div.textContent = `⏳ ${name}...`;
      results.appendChild(div);
      try {
        await fn();
        div.className = 'test pass';
        div.textContent = `✓ ${name}`;
        passed++;
      } catch (e) {
        div.className = 'test fail';
        div.textContent = `✗ ${name} — ${e.message}`;
        failed++;
        console.error(`[smoke] FAIL: ${name}`, e);
      }
    }

    // Import all modules
    const { createGame, Pool, SpatialHash, createRNG, createEventBus,
            createTweenManager, createSaveManager, createInputManager,
            createCamera2D, createCamera3D, createSceneManager, Easing } = await import('my-engine');

    // === Basic module tests ===

    await runTest('Pool: acquire/release', () => {
      const pool = new Pool(() => ({ x: 0, y: 0 }), (o) => { o.x = 0; o.y = 0; }, 5);
      const a = pool.acquire();
      const b = pool.acquire();
      if (pool.activeCount !== 2) throw new Error(`Expected 2 active, got ${pool.activeCount}`);
      pool.release(a);
      if (pool.activeCount !== 1) throw new Error('Release failed');
      if (pool.freeCount !== 4) throw new Error(`Expected 4 free, got ${pool.freeCount}`);
      pool.destroy();
    });

    await runTest('SpatialHash: insert/query', () => {
      const grid = new SpatialHash(32);
      grid.insert({ x: 10, y: 10, w: 20, h: 20 }, 'entity1');
      grid.insert({ x: 100, y: 100, w: 20, h: 20 }, 'entity2');
      const found = grid.query({ x: 5, y: 5, w: 30, h: 30 });
      if (!found.has('entity1')) throw new Error('Should find entity1');
      if (found.has('entity2')) throw new Error('Should not find entity2');
      grid.destroy();
    });

    await runTest('RNG: deterministic', () => {
      const rng1 = createRNG(42);
      const rng2 = createRNG(42);
      for (let i = 0; i < 100; i++) {
        if (rng1.random() !== rng2.random()) throw new Error('Not deterministic');
      }
    });

    await runTest('EventBus: on/emit/off', () => {
      const bus = createEventBus();
      let count = 0;
      const fn = () => count++;
      bus.on('test', fn);
      bus.emit('test');
      if (count !== 1) throw new Error('Event not fired');
      bus.off('test', fn);
      bus.emit('test');
      if (count !== 1) throw new Error('Event fired after off');
      bus.destroy();
    });

    await runTest('TweenManager: to/kill', () => {
      const tm = createTweenManager();
      const obj = { x: 0 };
      const tw = tm.to(obj, { x: 100 }, { duration: 1, ease: 'linear' });
      tm.update(0.5);
      if (Math.abs(obj.x - 50) > 1) throw new Error(`Expected ~50, got ${obj.x}`);
      tm.kill(tw);
      if (tm.count !== 0) throw new Error('Tween not killed');
      tm.destroy();
    });

    await runTest('Easing: all functions present', () => {
      const required = ['linear', 'easeInQuad', 'easeOutQuad', 'easeInOutQuad',
        'easeInCubic', 'easeOutCubic', 'easeInOutCubic', 'easeInElastic',
        'easeOutElastic', 'easeOutBounce'];
      for (const name of required) {
        if (typeof Easing[name] !== 'function') throw new Error(`Missing: ${name}`);
      }
    });

    await runTest('SaveManager: set/get/reset', () => {
      const save = createSaveManager('smoke_test_' + Date.now());
      save.set('score', 42);
      if (save.get('score') !== 42) throw new Error('Get failed');
      save.reset();
      if (save.get('score') !== undefined) throw new Error('Reset failed');
      save.clear();
    });

    await runTest('Camera2D: follow/shake', () => {
      const cam = createCamera2D();
      cam.follow({ x: 100, y: 50 }, { lerp: 1 });
      cam.update(0.1);
      cam.shake(0.1, 5);
      cam.update(0.05);
      if (typeof cam.x !== 'number') throw new Error('Camera x not a number');
      cam.destroy();
    });

    await runTest('SceneManager: add/go', async () => {
      const sm = createSceneManager();
      let entered = false;
      sm.add('test', {
        init() {}, enter() { entered = true; }, update() {}, exit() {}, destroy() {},
      });
      await sm.go('test');
      if (!entered) throw new Error('Scene not entered');
      if (sm.current !== 'test') throw new Error('Current not set');
      sm.destroy();
    });

    // === createGame tests ===

    await runTest('createGame: 2D mode', async () => {
      const game = await createGame({ mode: '2d', width: 100, height: 100, mount: '#game' });
      if (!game.ctx) throw new Error('No ctx');
      if (!game.input) throw new Error('No input');
      if (!game.tweens) throw new Error('No tweens');
      if (!game.events) throw new Error('No events');
      if (!game.rng) throw new Error('No rng');
      if (!game.audio) throw new Error('No audio');
      if (!game.camera) throw new Error('No camera');
      if (!game.scenes) throw new Error('No scenes');
      if (!game.hud) throw new Error('No hud');
      if (!game.save) throw new Error('No save');
      if (!game.debug) throw new Error('No debug');
      game.start();
      game.stop();
      game.destroy();
    });

    await runTest('createGame: 3D mode', async () => {
      const game = await createGame({ mode: '3d', width: 100, height: 100, mount: '#game' });
      if (!game.ctx.renderer) throw new Error('No renderer');
      game.start();
      game.stop();
      game.destroy();
    });

    await runTest('createGame: bad mode throws', async () => {
      try {
        await createGame({ mode: '4d', mount: '#game' });
        throw new Error('Should have thrown');
      } catch (e) {
        if (!e.message.includes('Unknown mode')) throw e;
      }
    });

    await runTest('createGame: bad mount throws', async () => {
      try {
        await createGame({ mount: '#nonexistent' });
        throw new Error('Should have thrown');
      } catch (e) {
        if (!e.message.includes('not found')) throw e;
      }
    });

    // === Regression tests for fixed bugs ===

    // Bug #1: start()/resume() duplicate hooks
    await runTest('Regression #1: pause/resume does not duplicate hooks', async () => {
      const game = await createGame({ mode: '2d', width: 100, height: 100, mount: '#game' });
      const obj = { x: 0 };
      game.tweens.to(obj, { x: 100 }, { duration: 1, ease: 'linear' });
      game.start();
      // Simulate 3 pause/resume cycles
      for (let i = 0; i < 3; i++) {
        game.pause();
        game.resume();
      }
      // After ~1s of updates, obj.x should be ~100 (not 400+ from duplicated hooks)
      // We'll simulate 1 second of updates manually
      // Since loop is async, we just check that hooks aren't duplicated by counting
      // the hook array length in the loop
      const hookCount = game._hooksInstalled ? 1 : 0;
      if (!game._hooksInstalled) throw new Error('Hooks not installed');
      // Start again — should NOT re-install hooks
      game.stop();
      game.start();
      game.start(); // triple start
      if (game._hooksInstalled !== true) throw new Error('Flag not set');
      game.stop();
      game.destroy();
    });

    // Bug #2: game.ready() hangs until start()
    await runTest('Regression #2: game.ready() resolves before start()', async () => {
      const game = await createGame({ mode: '2d', width: 100, height: 100, mount: '#game' });
      // ready() should resolve immediately after createGame returns
      let resolved = false;
      const timeout = setTimeout(() => { throw new Error('ready() timed out'); }, 1000);
      await game.ready();
      clearTimeout(timeout);
      resolved = true;
      if (!resolved) throw new Error('ready() did not resolve');
      game.destroy();
    });

    // Bug #3: camera3d orbit() crashes with minR/maxR
    await runTest('Regression #3: camera3d orbit({minR,maxR}) does not crash', async () => {
      const game = await createGame({ mode: '3d', width: 100, height: 100, mount: '#game' });
      // Should not throw
      game.camera.orbit({ target: { x: 0, y: 0, z: 0 }, minR: 5, maxR: 20 });
      game.destroy();
    });

    // Bug #4: hud applyPosition does not reset transform
    await runTest('Regression #4: HUD position change resets transform', async () => {
      const game = await createGame({ mode: '2d', width: 100, height: 100, mount: '#game' });
      game.hud.setText('test', 'Hello', { position: 'center' });
      // Find the element
      const el = document.querySelector('#__game-hud > div');
      if (!el) throw new Error('HUD element not found');
      const transformCenter = el.style.transform;
      if (!transformCenter.includes('translate')) throw new Error('Center should have transform');
      // Now change position
      game.hud.setText('test', 'World', { position: 'top-left' });
      const transformAfter = el.style.transform;
      if (transformAfter !== '') throw new Error(`Transform not reset: "${transformAfter}"`);
      game.destroy();
    });

    // Bug #5: hud cssText accumulates
    await runTest('Regression #5: HUD cssText does not accumulate', async () => {
      const game = await createGame({ mode: '2d', width: 100, height: 100, mount: '#game' });
      game.hud.setText('test', 'A', { style: 'color:red' });
      const el = document.querySelector('#__game-hud > div');
      const firstCss = el.style.cssText;
      game.hud.setText('test', 'B', { style: 'color:blue' });
      const secondCss = el.style.cssText;
      // Should not contain 'red' anymore
      if (secondCss.includes('red')) throw new Error('cssText accumulated old style');
      if (!secondCss.includes('blue')) throw new Error('New style not applied');
      game.destroy();
    });

    // Bug #7: autoDestroyAfter for particle systems
    await runTest('Regression #7: autoDestroyAfter removes emitter', async () => {
      const game = await createGame({ mode: '2d', width: 100, height: 100, mount: '#game' });
      game.addParticleSystem({ capacity: 10, emitRate: 5, x: 50, y: 50 }, { autoDestroyAfter: 0.2 });
      game.addParticleSystem({ capacity: 10, emitRate: 5, x: 50, y: 50 }, { autoDestroyAfter: 0.2 });
      if (game.emitterCount !== 2) throw new Error(`Expected 2 emitters, got ${game.emitterCount}`);
      // Simulate time passing
      game.start();
      await new Promise(r => setTimeout(r, 400));
      game.stop();
      if (game.emitterCount !== 0) throw new Error(`Expected 0 emitters after auto-destroy, got ${game.emitterCount}`);
      game.destroy();
    });

    // Bug #8: game.onSceneUpdate does not accumulate wrappers
    await runTest('Regression #8: onSceneUpdate callbacks fire correctly', async () => {
      const game = await createGame({ mode: '2d', width: 100, height: 100, mount: '#game' });
      let count1 = 0, count2 = 0, count3 = 0;
      game.onSceneUpdate(() => count1++);
      game.onSceneUpdate(() => count2++);
      game.onSceneUpdate(() => count3++);
      game.start();
      await new Promise(r => setTimeout(r, 100));
      game.stop();
      if (count1 === 0 || count2 === 0 || count3 === 0) throw new Error('Not all callbacks fired');
      // They should all have fired the same number of times
      if (count1 !== count2 || count2 !== count3) throw new Error('Callbacks fired different counts');
      game.destroy();
    });

    // Bug #9: debug pause/resume works
    await runTest('Regression #9: debug togglePause works', async () => {
      const game = await createGame({ mode: '2d', width: 100, height: 100, mount: '#game' });
      game.start();
      if (game.isPaused) throw new Error('Should not be paused initially');
      game.debug.togglePause();
      if (!game.isPaused) throw new Error('Should be paused after togglePause');
      game.debug.togglePause();
      if (game.isPaused) throw new Error('Should be resumed after second togglePause');
      game.stop();
      game.destroy();
    });

    // Bug #10: 3D per-particle size/alpha via ShaderMaterial
    await runTest('Regression #10: 3D particles have aAlpha attribute', async () => {
      const game = await createGame({ mode: '3d', width: 100, height: 100, mount: '#game' });
      const { renderer } = game.ctx;
      const sysId = renderer.createParticleSystem({ capacity: 10 });
      renderer.emitParticles(sysId, 5, { life: 2, size: 0.1, color: [1, 0, 0] });
      const sys = renderer.particleSystems.get(sysId);
      if (!sys.geometry.attributes.aAlpha) throw new Error('Missing aAlpha attribute');
      if (!sys.geometry.attributes.aSize) throw new Error('Missing aSize attribute');
      // After emit, alphas should be > 0
      let hasAlpha = false;
      for (let i = 0; i < 10; i++) {
        if (sys.alphas[i] > 0) { hasAlpha = true; break; }
      }
      if (!hasAlpha) throw new Error('No particles have alpha > 0 after emit');
      // After update, alphas should change
      renderer.updateParticles(sysId, 0.5);
      renderer.removeParticleSystem(sysId);
      game.destroy();
    });

    // Bug #11: assets loadTexture with engine hint
    await runTest('Regression #11: assets.loadTexture with engine hint', async () => {
      const game = await createGame({ mode: '2d', width: 100, height: 100, mount: '#game' });
      // Just test that the function exists and accepts options
      if (typeof game.assets.load !== 'function') throw new Error('assets.load not a function');
      // We can't easily test actual loading without a real URL, but we verify the API
      game.destroy();
    });

    // Bug #12: ctx.camera documentation (just verify it exists in 3D)
    await runTest('Regression #12: ctx.camera is raw Three.js camera in 3D', async () => {
      const game = await createGame({ mode: '3d', width: 100, height: 100, mount: '#game' });
      if (!game.ctx.camera) throw new Error('ctx.camera should exist in 3D mode');
      // It should be a PerspectiveCamera (has isPerspectiveCamera)
      if (!game.ctx.camera.isPerspectiveCamera) throw new Error('ctx.camera should be PerspectiveCamera');
      // game.camera should be the wrapper
      if (game.camera === game.ctx.camera) throw new Error('game.camera should be wrapper, not raw');
      game.destroy();
    });

    // Additional: plugin system
    await runTest('Plugin system: use() registers and calls lifecycle', async () => {
      const game = await createGame({ mode: '2d', width: 100, height: 100, mount: '#game' });
      let started = false, updated = 0, destroyed = false;
      game.use((g) => ({
        start() { started = true; },
        update(dt) { updated++; },
        destroy() { destroyed = true; },
      }));
      if (!started) throw new Error('Plugin start not called');
      game.start();
      await new Promise(r => setTimeout(r, 50));
      game.stop();
      if (updated === 0) throw new Error('Plugin update not called');
      game.destroy();
      if (!destroyed) throw new Error('Plugin destroy not called');
    });

    // Additional: resize
    await runTest('resize() updates config and renderer', async () => {
      const game = await createGame({ mode: '2d', width: 100, height: 100, mount: '#game' });
      game.resize(200, 150);
      if (game.config.width !== 200) throw new Error('Config width not updated');
      if (game.config.height !== 150) throw new Error('Config height not updated');
      game.destroy();
    });

    // Summary
    summary.textContent = `${passed} passed, ${failed} failed`;
    summary.style.color = failed === 0 ? '#4f4' : '#f44';
    summary.style.background = failed === 0 ? '#1a4d1a' : '#4d1a1a';
  </script>
</body>
</html>
